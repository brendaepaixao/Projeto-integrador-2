<!DOCTYPE html>
<html>
<head>
    <h1>Sistema De Gestão Universitária</h1>
    <link rel="stylesheet" type="text/css" href="../css/style.css">
</head>

<body>

    <header>

        <div class="container">
            <h2>Menu</h2>

            <nav>
                <ul>
                    <ul>
    <li><a href="alunos.html" class="btn">Gerir Alunos</a></li>
    <li><a href="docentes.html" class="btn">Gerir Docentes</a></li>
    <li><a href="fornecedores.html" class="btn">Gerir Fornecedores</a></li>
    <li><a href="pessoas.html" class="btn">Gerir Pessoas</a></li>
    
                </ul>
            </nav>
        </div>

    </header>

<div class="container">
    <div class="card">
        <h2>Cadastro de Alunos</h2>

        <form>

            <label>Nome:</label>
            <input type="text" required>

            <label>CPF:</label>
            <input type="text" id="cpf" required>
            <small id="erroCpf" style="color:red; display:none;">
                CPF inválido
            </small>

            <label>Curso:</label>
            <input type="text" required>

            <button type="submit" class="btn">Cadastrar</button>

        </form>
    </div>
</div>

<script>
document.querySelector("form").addEventListener("submit", function(event) {
    let cpf = document.getElementById("cpf").value;

    if (cpf.length < 11) {
        event.preventDefault();
        document.getElementById("erroCpf").style.display = "block";
    }
});
</script>


</body>

</html>
